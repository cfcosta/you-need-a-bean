/* ============================== derived data ============================== */

const toBRL   = (n, cur) => n * RATES[cur];
const convert = (n, from, to) => n * RATES[from] / RATES[to];

function txnConverted(t, op) { return convert(t[4], t[5], op); }

/* spent (in op currency) for a category in a live month */
function spentLive(cat, m, op) {
  return (cat.txns[m] || []).reduce((s, t) => s + txnConverted(t, op), 0);
}
/* full history map month -> spent (op currency) */
function histMap(cat, op) {
  const h = {};
  STUB_MONTHS.forEach((m, i) => h[m] = convert(cat.stubs[i], "BRL", op));
  LIVE_MONTHS.forEach(m => h[m] = spentLive(cat, m, op));
  return h;
}
/* average of the `basis` months strictly before `sel` */
function avgFor(cat, sel, basis, op) {
  const h = histMap(cat, op);
  const idx = ALL_MONTHS.indexOf(sel);
  const win = ALL_MONTHS.slice(Math.max(0, idx - basis), idx);
  if (!win.length) return 0;
  return win.reduce((s, m) => s + h[m], 0) / win.length;
}
function avgWindowLabel(sel, basis) {
  const idx = ALL_MONTHS.indexOf(sel);
  const win = ALL_MONTHS.slice(Math.max(0, idx - basis), idx);
  return monthShort(win[0]) + " – " + monthShort(win[win.length - 1]) + " " + win[win.length-1].slice(0,4);
}
/* native-currency breakdown of a category-month */
function currencySplit(cat, m) {
  const by = {};
  (cat.txns[m] || []).forEach(t => by[t[5]] = (by[t[5]] || 0) + t[4]);
  return by;
}
function statusFor(spent, target) {
  if (target <= 0) return spent > 0 ? "over" : "good";
  const r = spent / target;
  return r > 1 ? "over" : r > 0.85 ? "warn" : "good";
}

/* ============================== formatting ============================== */

const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });

function fmt(n, cur, dec = 2) {
  const abs = Math.abs(n);
  const s = (dec === 0 ? nf0 : nf2).format(abs);
  return (n < 0 ? "−" : "") + SYM[cur] + " " + s;
}
const fmtCode = (n, cur) => (n < 0 ? "−" : "") + nf2.format(Math.abs(n)) + " " + cur;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  const typical = CATS.reduce((s, c) => s + avgFor(c, m, state.basis, op), 0);
  const isNow   = m === TODAY.month;
  const pctTyp  = typical ? Math.round(spent / typical * 100) : 0;
  const pctMon  = Math.round(TODAY.day / TODAY.daysIn * 100);
  const net     = income - spent;
  $("#strip").innerHTML = `
    <div class="tile"><div class="lbl">Income${isNow ? " so far" : ""}</div>
      <div class="val num">${fmt(income, op, 0)}</div>

    const gAvg   = cats.reduce((s, c) => s + avgFor(c, m, state.basis, op), 0);
    const closed = state.closedGroups.has(g);
    html += `

        <span class="g-amt">${fmt(gSpent, op, 0)}</span>
        <span class="g-amt">${gAvg > 0 ? Math.round(gSpent / gAvg * 100) + "%" : "—"}</span>
      </button>`;
    if (closed) continue;
    for (const c of cats) {
      const spent  = spentLive(c, m, op);
      const target = avgFor(c, m, state.basis, op);
      const left   = target - spent;
      const st     = statusFor(spent, target);
      const r      = target > 0 ? spent / target : 0;
      const fillPct  = target > 0 ? Math.min(r, CAP) / CAP * 100 : 0;
      const pctLabel = target > 0 ? Math.round(r * 100) + "%" : "—";
      const vsTip = left < 0
        ? `${fmt(spent, op)} spent — ${fmt(-left, op)} over the ${state.basis}-mo average of ${fmt(target, op)}`
        : `${fmt(spent, op)} spent of ${fmt(target, op)} typical`;
      const split  = currencySplit(c, m);
      const mixed  = Object.keys(split).filter(k => k !== op);
      const fxTip  = Object.entries(split).map(([k, v]) => fmtCode(v, k)).join("  +  ");
      html += `
      <button class="cat-row ${state.cat === c.id ? "sel" : ""}" data-cat="${c.id}" aria-selected="${state.cat === c.id}" title="${esc(c.raw)}">
        <span class="cat-name">
          <span class="p">${esc(c.pretty)}</span>
        </span>
        <span class="cell num">${fmt(target, op)}</span>
        <span class="cell num">${fmt(spent, op)}${mixed.length ? `<span class="fx" title="Native amounts: ${esc(fxTip)}">+${mixed.join("+")}</span>` : ""}</span>
        <span class="vs-cell">
          <span class="vsbar ${st}" title="${esc(vsTip)}">
            <span class="fill" style="width:${fillPct}%"></span>
            <span class="avg-mark" style="left:${MARK}%"></span>
            ${isNow ? `<span class="pace" style="left:${pacePos}%" title="Day ${TODAY.day} of ${TODAY.daysIn} — even-pace mark"></span>` : ""}
          </span>
          <span class="vs-pct num ${st}">${pctLabel}</span>
        </span>
      </button>`;
    }
  }
  $("#tbody").innerHTML = html;
}

function chartHTML(cat) {
  const op = state.op, h = histMap(cat, op);
  const idx = ALL_MONTHS.indexOf(state.month);
  const win = ALL_MONTHS.slice(idx - 5, idx + 1);
  const avg = avgFor(cat, state.month, state.basis, op);
  const max = Math.max(...win.map(m => h[m]), avg, 1);
  const H = 94;                                   // px height of plot area
  const cols = win.map(m => {
    const v = h[m];
    const isNow = m === state.month;
    const bh = Math.max(v / max * H, v > 0 ? 3 : 1.5);
    return `<div class="col ${isNow ? "now" : ""}" title="${monthName(m)}: ${fmt(v, op)}">
        ${isNow ? `<span class="cap num" style="bottom:${bh + 3}px">${fmt(v, op, 0)}</span>` : ""}
        <div class="bar" style="height:${bh}px"></div>
      </div>`;
  }).join("");
  return `<div class="chart" role="img" aria-label="Spending for the last 6 months">
      <div class="cols">${cols}</div>
      <div class="baseline"></div>
      <div class="avg-line" style="bottom:${16 + avg / max * H}px"></div>
      <div class="avg-tag num" style="bottom:${16 + avg / max * H}px">avg ${fmt(avg, op, 0)}</div>
      <div class="xlabels">${win.map(m => `<span>${monthShort(m)}</span>`).join("")}</div>
    </div>`;
}

function txnChips(t) {
  const x = t[6] || {};
  let chips = "";
  if (t[1] === "!") chips += `<span class="badge pend" title="flag: ! (pending)">!</span>`;
  (x.t || []).forEach(tag => chips += `<span class="badge tag">#${esc(tag)}</span>`);
  (x.l || []).forEach(l => chips += `<span class="badge tag link-chip" title="link">^${esc(l)}</span>`);
  return chips;
}

function txnDetailHTML(cat, t, ti) {
  const x = t[6] || {};
  const op = state.op;
  const conv = txnConverted(t, op);
  const acctFrom = t[5] === "EUR" ? "Assets:ExampleBank:EUR"
                 : t[5] === "USD" ? "Liabilities:SampleBank:Card"
                 : "Liabilities:DemoBank:Card";
  let html = `<div class="txn-detail">`;
  html += `<div><div class="detail-label">Postings</div>
    <div class="postings mono num"><table>
      <tr><td>${esc(cat.raw)}</td><td>${fmtCode(t[4], t[5])}</td></tr>
      <tr><td>${esc(acctFrom)}</td><td>${fmtCode(-t[4], t[5])}</td></tr>
    </table></div></div>`;
  const meta = Object.entries(x.m || {});
  if (meta.length || (x.t || []).length || (x.l || []).length) {
    html += `<div><div class="detail-label">Metadata</div><dl class="kv mono">`;
    meta.forEach(([k, v]) => html += `<dt>${esc(k)}:</dt><dd>"${esc(v)}"</dd>`);
    (x.t || []).forEach(tag => html += `<dt>tag</dt><dd>#${esc(tag)}</dd>`);
    (x.l || []).forEach(l => html += `<dt>link</dt><dd>^${esc(l)}</dd>`);
    html += `</dl></div>`;
  }
  if (t[5] !== op) {
    html += `<div><div class="detail-label">Conversion</div>
      <div class="kv mono"><dt>${fmtCode(t[4], t[5])}</dt><dd>= ${fmt(conv, op)} @ ${(RATES[t[5]] / RATES[op]).toFixed(2)}</dd></div></div>`;
  }
  html += `</div>`;
  return html;
}

function renderInspector() {
  const cat = catById(state.cat);
  const op = state.op, m = state.month;
  if (!cat) { $("#insp-body").innerHTML = `<div class="empty">Select a category to inspect it.</div>`; return; }

  const spent  = spentLive(cat, m, op);
  const target = avgFor(cat, m, state.basis, op);
  const left   = target - spent;
  const st     = statusFor(spent, target);
  const pct    = target > 0 ? Math.min(spent / target * 100, 100) : (spent > 0 ? 100 : 0);
  const txns   = (cat.txns[m] || []);
  const split  = currencySplit(cat, m);
  const splitKeys = Object.keys(split);

  let html = `
    <div class="insp-head">
      <div class="crumb">${esc(cat.group)} · ${monthName(m)}</div>
      <h2>${esc(cat.pretty)}</h2>
      <div class="raw mono">${esc(cat.raw)} · <span class="meta-src" title='2019-01-01 open ${esc(cat.raw)}${"\n"}  name: "${esc(cat.pretty)}"'>name: "${esc(cat.pretty)}"</span></div>
    </div>

    <div class="card">
      <h3>Target — spend average</h3>
      <div class="target-val num">${fmt(target, op)}<span class="target-sub"> / month</span></div>
      <div class="target-sub">average of ${avgWindowLabel(m, state.basis)} (${state.basis} mo)</div>
      <div class="target-meter meter ${st}"><span class="fill" style="width:${pct}%"></span></div>
      <div class="target-legend num"><span>spent <b>${fmt(spent, op)}</b></span>
        <span>${left < 0 ? `<b style="color:var(--over-text)">${fmt(-left, op)} over · ${target > 0 ? Math.round(spent / target * 100) + "%" : "—"}</b>`
                         : `<b>${target > 0 ? Math.round(spent / target * 100) + "%" : "—"}</b> of typical`}</span></div>
    </div>

    <div class="card"><h3>Last 6 months</h3>${chartHTML(cat)}</div>`;

  if (splitKeys.length > 1 || (splitKeys.length === 1 && splitKeys[0] !== op)) {
    html += `<div class="card"><h3>This month by currency</h3><div class="cur-split num">` +
      splitKeys.map(k => `<div class="cur-row"><span class="native mono">${fmtCode(split[k], k)}</span>
        <span class="conv">${k === op ? "operating currency" : `= ${fmt(convert(split[k], k, op), op)} @ ${(RATES[k] / RATES[op]).toFixed(2)}`}</span></div>`).join("") +
      `</div></div>`;
  }

  html += `<div><div class="detail-label" style="margin:4px 0 2px">Transactions — ${monthName(m)} (${txns.length})</div><div class="txn-list">`;
  if (!txns.length) html += `<div class="empty">No transactions in ${monthName(m)}.</div>`;
  txns.forEach((t, ti) => {
    const open = state.openTxns.has(ti);
    const conv = txnConverted(t, op);
    html += `
      <button class="txn ${open ? "open" : ""}" data-txn="${ti}" aria-expanded="${open}">
        <span class="d num mono">${String(t[0]).padStart(2, "0")}</span>
        <span class="who">
          <span class="payee">${esc(t[2])} ${txnChips(t)}</span>
          ${t[3] ? `<span class="narr">${esc(t[3])}</span>` : ""}
        </span>
        <span class="amt num">${fmt(t[4], t[5])}${t[5] !== op ? `<span class="conv">= ${fmt(conv, op)}</span>` : ""}</span>
      </button>
      ${open ? txnDetailHTML(cat, t, ti) : ""}`;
  });
  html += `</div></div>`;
  $("#insp-body").innerHTML = html;
}

function renderAll() {
  renderTopbar();
  renderSidebarAccounts();
  renderStrip();
  renderTable();
  renderInspector();
}

/* ============================== events ============================== */

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

$("#prev-month").addEventListener("click", () => {
  const i = LIVE_MONTHS.indexOf(state.month);
  if (i > 0) { state.month = LIVE_MONTHS[i - 1]; state.openTxns.clear(); renderAll(); }
});
$("#next-month").addEventListener("click", () => {
  const i = LIVE_MONTHS.indexOf(state.month);
  if (i < LIVE_MONTHS.length - 1) { state.month = LIVE_MONTHS[i + 1]; state.openTxns.clear(); renderAll(); }
});
$("#seg-basis").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.basis = +b.dataset.b; renderAll();
});
$("#seg-cur").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.op = b.dataset.c; renderAll();
});

$("#tbody").addEventListener("click", e => {
  const g = e.target.closest(".grp-head");
  if (g) {
    const name = g.dataset.group;
    state.closedGroups.has(name) ? state.closedGroups.delete(name) : state.closedGroups.add(name);
    renderTable();
    return;
  }
  const row = e.target.closest(".cat-row");
  if (row) {
    state.cat = row.dataset.cat;
    state.openTxns.clear();
    renderTable(); renderInspector();
    if (window.matchMedia("(max-width: 1200px)").matches) $("#inspector").classList.add("open");
  }
});

$("#insp-body").addEventListener("click", e => {
  const txn = e.target.closest(".txn");
  if (txn) {
    const ti = +txn.dataset.txn;
    state.openTxns.has(ti) ? state.openTxns.delete(ti) : state.openTxns.add(ti);
    renderInspector();
  }
});

$("#insp-close").addEventListener("click", () => $("#inspector").classList.remove("open"));
$("#burger").addEventListener("click", () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("show"); });
$("#scrim").addEventListener("click", () => { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); });

document.querySelectorAll(".nav-item:not(.active)").forEach(b =>
  b.addEventListener("click", () => toast("mock — not part of iteration 1")));

renderAll();
</script>
