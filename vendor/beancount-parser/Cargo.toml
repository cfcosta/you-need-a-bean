# Vendored copy of beancount-parser 2.6.0 (Unlicense, github.com/jcornaz/beancount-parser),
# wired in via [patch.crates-io] in the workspace root. Local change vs upstream:
# src/amount.rs accepts a unary plus in amount expressions ("+123.45 USD"),
# which Python beancount allows and real ledgers contain. See VENDOR.md.

[package]
edition = "2021"
rust-version = "1.68"
name = "beancount-parser"
version = "2.6.0"
authors = ["Jonathan Cornaz"]
description = "A beancount file parser library for rust"
keywords = ["parsing", "beancount", "accounting"]
categories = ["parser-implementations"]
license = "Unlicense"
repository = "https://github.com/jcornaz/beancount-parser"

[lib]
name = "beancount_parser"
path = "src/lib.rs"

[dependencies.miette]
version = "5"
optional = true

[dependencies.nom]
version = "8"
features = ["std"]
default-features = false

[dependencies.nom_locate]
version = "5"
default-features = false

[lints.clippy]
pedantic = "warn"

[lints.rust]
missing_docs = "warn"
private_bounds = "deny"
private_interfaces = "deny"
unsafe_code = "deny"
