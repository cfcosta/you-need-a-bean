[workspace]
members = [
  "crates/beancount-parser",
  "crates/conformance",
  "crates/core",
  "crates/desktop",
  "crates/sql",
]
resolver = "3"

[workspace.dependencies]
beancount-parser = { path = "crates/beancount-parser" }

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Cainã Costa <me@cfcosta.com>"]
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
