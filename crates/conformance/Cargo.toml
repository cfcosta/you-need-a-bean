# The contract the beancount parser must satisfy. Depends on the parser and
# nothing else from this workspace, so a from-scratch replacement can be
# developed against this crate in isolation. See docs/PARSER.md.
[package]
name = "you-need-a-bean-conformance"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[lib]
name = "bean_conformance"
# criterion owns the bench harness; libtest does not understand its flags.
bench = false

[dependencies]
beancount-parser = "2.6.0"
rust_decimal = "1.42.1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "parse"
harness = false
