[package]
name = "you-need-a-bean-core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "bean_core"
# criterion owns the bench harness; libtest does not understand its flags.
bench = false

[dependencies]
beancount-parser.workspace = true
glob = "0.3.4"
miette = "7.6.0"
rust_decimal = "1.42.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }
hegeltest = "0.48.1"
jiff = "0.2"

[[bench]]
name = "pipeline"
harness = false
