[package]
name = "you-need-a-bean-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "bean_cli"
path = "src/lib.rs"

[[bin]]
name = "you-need-a-bean"
path = "src/main.rs"

[dependencies]
axum = "0.8"
miette = { version = "7.6.0", features = ["fancy"] }
mime_guess = "2"
rust-embed = "8"
rust_decimal = "1.42.1"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1", features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
you-need-a-bean-core = { path = "../core" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
