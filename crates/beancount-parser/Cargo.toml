# Workspace copy of beancount-parser 2.6.0 (Unlicense, github.com/jcornaz/beancount-parser).
# Local changes vs upstream are listed in VENDOR.md, including the newer
# edition, rust-version and dependency versions below.

[package]
edition = "2024"
rust-version = "1.98"
name = "beancount-parser"
version = "2.6.0"
authors = ["Jonathan Cornaz", "Cainã Costa <me@cfcosta.com>"]
description = "A beancount file parser library for rust"
keywords = ["parsing", "beancount", "accounting"]
categories = ["parser-implementations"]
license = "Unlicense"
repository = "https://github.com/jcornaz/beancount-parser"

[lib]
name = "beancount_parser"
path = "src/lib.rs"

[dependencies.miette]
version = "7.6.0"
optional = true

[dependencies.nom]
version = "8.0.0"
features = ["std"]
default-features = false

[dependencies.nom_locate]
version = "5.0.0"
default-features = false

[dev-dependencies.rstest]
version = "0.27.0"
default-features = false

[lints.clippy]
pedantic = "warn"

[lints.rust]
missing_docs = "warn"
private_bounds = "deny"
private_interfaces = "deny"
unsafe_code = "deny"
